# Dependabot version updates. Patch/minor PRs are tier:0 and auto-merge when
# CI is green; majors are tier:2 (Atlas). See .github/risk-tiers.yml.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/gzen"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
