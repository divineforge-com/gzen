name: CI

# Required checks: build, test, gitleaks (see divineforge/sentinel docs/team/OWNERSHIP.md).
# Scope notes:
#  - apps/gzen (Astro) has no lint/typecheck/test scripts yet, so CI runs
#    `npm ci && npm run build` only. Add `astro check` once @astrojs/check is a dev dep.
#  - Hugo apps (enlight, gzen-invest, gzen-ki, gzen-learn, gzen-om) are build-checked.
#  - Go (cmd/gzen-tool): build, vet, test (no tests yet).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/gzen/package-lock.json
      - name: Astro build (apps/gzen)
        working-directory: apps/gzen
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install Hugo extended
        run: |
          curl -sSfL -o /tmp/hugo.tgz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSfL -o /tmp/hugo_checksums.txt "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt"
          want=$(grep " hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz$" /tmp/hugo_checksums.txt | cut -d" " -f1)
          [ -n "$want" ] || { echo "no checksum found for hugo tarball"; exit 1; }
          echo "${want}  /tmp/hugo.tgz" | sha256sum -c -
          tar -xzf /tmp/hugo.tgz -C /tmp hugo && sudo install /tmp/hugo /usr/local/bin/hugo
      - name: Hugo builds
        run: |
          set -e
          for a in enlight gzen-invest gzen-ki gzen-learn gzen-om; do
            echo "::group::$a"; (cd "apps/$a" && hugo --gc --minify -d "/tmp/hugo-$a"); echo "::endgroup::"
          done
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Go build
        run: go build ./...

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (matches the release checksums.txt)
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan working tree
        run: gitleaks dir . --redact --no-banner --exit-code 1 $( [ -f .gitleaks.toml ] && echo --config .gitleaks.toml )
      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --redact --no-banner --exit-code 1 $( [ -f .gitleaks.toml ] && echo --config .gitleaks.toml ) \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  risk-tier-tests:
    name: risk-tier tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml==6.0.2
      - name: Unit-test the risk-tier script and this repo's tier rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
