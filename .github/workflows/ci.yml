name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: site (build, panicOnWarning, link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Install pinned Hugo extended and lychee (versions in Makefile)
        run: make tools
      - name: make build
        run: make build
      - name: make check
        run: make check

  # TODO(Tether): security gates (PLAN.md "CI gates from day one").
  # Replace this stub on feat/hugo-scaffold with:
  #   - gitleaks over the full history (checkout with fetch-depth: 0)
  #   - govulncheck on every Go module (wasm/*, the tool repos' go.mod files)
  # Until then this job only warns; it does not gate anything.
  security:
    name: security (stub, Tether)
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning title=security gates pending::gitleaks + govulncheck are not wired yet (Tether)"
