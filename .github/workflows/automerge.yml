name: Auto-merge T0

# Squash-merges open tier:0 PRs (docs/content, Dependabot patch/minor) once the
# CI workflow is green on the PR head. T1 auto-merge is OFF (phase 2, see
# dforge stacky/VELOCITY.md). T2/T3 never auto-merge.
#
# Kill switch (one step):  gh variable set AUTOMERGE_ENABLED --body false -R <owner/repo>
# Re-enable:               gh variable delete AUTOMERGE_ENABLED -R <owner/repo>
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '17 1,13 * * *'   # fallback sweep twice a day (09:17 / 21:17 MYT)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  sweep:
    if: vars.AUTOMERGE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml
      - name: Merge green tier:0 PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOMERGE_ENABLED: ${{ vars.AUTOMERGE_ENABLED }}
        run: python3 .github/scripts/risk_tier.py sweep
