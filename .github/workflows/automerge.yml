name: Auto-merge T0

# Squash-merges open tier:0 PRs (docs/content, Dependabot patch/minor) once the
# CI workflow is green on the PR head. T1 auto-merge is OFF (phase 2, see
# dforge stacky/VELOCITY.md). T2/T3 never auto-merge.
#
# FAILS CLOSED: this workflow does nothing unless the repo variable
# AUTOMERGE_ENABLED is exactly 'true'. The variable is NOT set by this change;
# William turns auto-merge on per repo, in his own words:
#   Enable:   gh variable set AUTOMERGE_ENABLED --body true -R <owner/repo>
#   Disable:  gh variable delete AUTOMERGE_ENABLED -R <owner/repo>
#             (or set it to anything other than 'true', e.g. false)
#
# Every merge re-classifies the PR from its files and commits at the exact head
# SHA being merged (labels are only a hint), merges only same-repo PRs opened
# by divineforge or dependabot[bot], and pins the merge to that SHA.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '17 1,13 * * *'   # fallback sweep twice a day (09:17 / 21:17 MYT)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  sweep:
    if: vars.AUTOMERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4   # default branch only: script and rules are the reviewed ones
        with:
          sparse-checkout: .github
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet pyyaml==6.0.2
      - name: Merge green tier:0 PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTOMERGE_ENABLED: ${{ vars.AUTOMERGE_ENABLED }}
        run: python3 .github/scripts/risk_tier.py sweep
