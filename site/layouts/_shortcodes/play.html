{{- /* {{< play "go" >}}: embed /play/<game>/ (built by scripts/build-wasm.sh) in the square game stage. */ -}}
{{- $game := .Get 0 }}
<div class="play"><iframe class="play-stage" src="{{ printf "/play/%s/" $game | relURL }}" title="{{ $game }}, playable in the browser" loading="lazy" style="width:100%;border:0"></iframe></div>
