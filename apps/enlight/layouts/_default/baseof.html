<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --ink: #111111;
      --muted: #6b6b6b;
      --border: rgba(0, 0, 0, 0.08);
      --accent: #b45309;
      --accent-soft: rgba(180, 83, 9, 0.08);
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(250, 250, 250, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      font-size: 1.1rem;
      letter-spacing: -0.01em;
    }
    .brand span {
      color: var(--accent);
    }
    nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 1.25rem;
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    nav a:hover {
      color: var(--ink);
    }
    main {
      max-width: 800px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }
    h1 {
      font-size: 2rem;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: var(--muted);
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
    }
    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      margin-top: 2rem;
    }
    .post-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .post-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
    }
    .post-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 0.4rem 0;
      color: var(--ink);
    }
    .post-desc {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 2.5rem 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 4rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/" class="brand"><span>✦</span> enlight<strong>.gzen.io</strong></a>
      <nav>
        <a href="/principles/">Principles</a>
        <a href="/koans/">Koans</a>
        <a href="/stillness/">Stillness</a>
        <a href="https://gzen.io">gZen Portal ↗</a>
      </nav>
    </div>
  </header>

  <main>
    {{ block "main" . }}{{ end }}
  </main>

  <footer>
    <p>enlight · Wisdom beneath gZen.io · Clear thinking, stillness, and mindful living.</p>
  </footer>
</body>
</html>
