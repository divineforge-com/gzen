<a href=https://gzen.io/>门户</a></nav></header><main class=wrap><article class=prose><h1>关于</h1><p><strong>gZen Om（唵）</strong> 是 gZen 知识门户的第四扇门 —— 以中文为主的佛教学习笔记。</p><p>这里不追求热闹，只记录：</p><ul><li>经典阅读札记</li><li>止观与日常修行</li><li>名相澄清（避免望文生义）</li><li>把佛法落到生活里的观察</li></ul><h3 id=为什么叫-om--唵>为什么叫 Om / 唵？</h3><ul><li><strong>O</strong> 对应 K.I.L.O. 的第四字母</li><li><strong>Om / 唵</strong> 是跨传统熟悉的神圣音节，短、好记、有分量</li><li>不用单纯的 “O”（太空）或 “On/恩”（偏日语语境）</li></ul><p>门户入口：<a href=https://gzen.io>gzen.io</a> · 工程写作见 <a href=https://divineforge.com>DivineForge</a></p></article></main><footer class=foot><p>静中观心 · <a href=https://gzen.io>K.I.L.O.</a></p></footer></body></html>
