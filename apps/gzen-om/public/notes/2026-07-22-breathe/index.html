<a href=https://gzen.io/>门户</a></nav></header><main class=wrap><article class=prose><h1>第一课：呼吸与安住</h1><p class=meta>2026年7月22日</p><h2 id=观察>观察</h2><p>忙碌的一天里，心常常跑在身体前面。还没坐稳，念头已经到了下一件事。</p><h2 id=教导>教导</h2><p>佛陀教导以正念安住呼吸（安那般那念）。不是强迫空白，而是知道：吸时知吸，呼时知呼。</p><h2 id=实践>实践</h2><ol><li>找一个不太会被打断的三分钟。</li><li>背正直，肩放松，眼可轻闭。</li><li>只跟随着前三次完整呼吸，心跑了就轻轻回来。</li><li>结束时，对自己说：这样就够了。</li></ol><blockquote><p>不必立刻深奥。先诚实。</p></blockquote></article></main><footer class=foot><p>静中观心 · <a href=https://gzen.io>K.I.L.O.</a></p></footer></body></html>
